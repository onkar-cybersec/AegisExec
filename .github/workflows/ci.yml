name: AegisExec CI & Linux Sandbox Integration
permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit Tests & Linux Bubblewrap Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Bubblewrap system package
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libcap2-bin

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run AegisExec Doctor
        run: |
          python -m aegisexec doctor

      - name: Run Unit & Linux Sandbox Integration Tests (Require Sandbox)
        env:
          REQUIRE_SANDBOX: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Validate CLI Workflow Fail-Closed Behaviors
        run: |
          # Test init
          mkdir -p ci_sandbox
          python -m aegisexec init --dir ci_sandbox

          # Test check benign
          python -m aegisexec check ci_sandbox/requests/valid_read.json --policy ci_sandbox/policy.json

          # Test check traversal fails closed (exit code 2)
          set +e
          python -m aegisexec check ci_sandbox/requests/attack_traversal.json --policy ci_sandbox/policy.json
          denied_status=$?
          set -e
          test "$denied_status" -eq 2

          # Test verify baseline
          python -m aegisexec verify ci_sandbox/tools.json --baseline ci_sandbox/baseline.json

          # Test report generation
          python -m aegisexec report ci_sandbox/audit.jsonl --format json
          python -m aegisexec report ci_sandbox/audit.jsonl --format html -o ci_sandbox/report.html
